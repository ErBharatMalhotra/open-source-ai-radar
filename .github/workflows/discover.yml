# Discover new repos + sync scheduler (lightweight)
name: Discover Repos

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      force_classify:
        description: "Re-classify ALL repos (backfill categorization)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Shared with Process Repos and Daily Breakout: they all rewrite the same
  # generated artefacts, so they must never run at the same time.
  group: data-refresh
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # A normal run takes ~11 min. The Sunday `--force --provider groq` pass
    # re-classifies every low-confidence repo: ~2,900 repos at 50 per request
    # with a 45s Groq rate-limit pause is ~45 min of API time on its own, so a
    # 25 min cap guaranteed cancellation on every Sunday run (runs 43695311588,
    # 43753093541, 45007708344, 45067463274) and threw away all of that work.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # REPO_TOKEN is optional: a stale/limited PAT used to fail every push with
      # HTTP 403. The script validates it and falls back to GITHUB_TOKEN.
      - name: Configure git auth (validated token)
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci_git_auth.sh

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Run category discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run radar discover --limit 50 --category ai-agents
          uv run radar discover --limit 50 --category llm-frameworks
          uv run radar discover --limit 50 --category ai-coding
          uv run radar discover --limit 50 --category mcp
          uv run radar discover --limit 50 --category rag
          uv run radar discover --limit 50 --category local-ai

      - name: Import to SQLite
        run: uv run radar import-json

      - name: Classify repos
        # --force re-classifies every repo: heals drift when categorization
        # rules change. Uses Groq LLM for low-confidence repos.
        # Partial completion is OK — classified repos are saved, rest continue next run.
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_classify }}" = "true" ]; then
            FORCE="--force --provider groq"
          elif [ "$(date -u +%u)" = "7" ]; then
            FORCE="--force --provider groq"
          fi
          uv run radar classify $FORCE || echo "Classification partially completed (OK)"

      - name: Sync processing scheduler
        run: uv run radar sync-cursor

      - name: Save database
        # Saved before the export/commit steps on purpose: the weekly --force
        # pass costs ~45 min of Groq time, and this cache is the only place the
        # classifications live. A failure later in the job must not discard it.
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          # Unique key per run — cache entries are immutable, a fixed key
          # would silently skip every save after the first one.
          key: radar-db-${{ github.run_id }}

      - name: Export JSON
        # Regenerate exports so classification changes (especially the
        # weekly --force re-classify) reach the website immediately,
        # instead of waiting for the next Process Repos run.
        run: uv run python scripts/export.py

      - name: Refresh README live stats
        run: uv run python scripts/update_readme_stats.py

      - name: Commit updated data
        # Stages only generated artefacts, rebases onto the newest main and
        # keeps this run's snapshot when a generated file conflicts.
        run: |
          bash scripts/ci_commit_data.sh "chore: discovery + scheduler sync"
