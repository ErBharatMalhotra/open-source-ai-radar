# Daily Breakout & Velocity Intelligence Audit
name: Daily Breakout PR

on:
  schedule:
    - cron: "0 6,18 * * *" # Twice daily at 06:00 and 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-breakout-pr
  cancel-in-progress: false

jobs:
  breakout-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Configure git auth
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci_git_auth.sh

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Run breakouts & anomaly detection
        run: |
          uv run radar breakouts --limit 50 || echo "Breakouts generation skipped"
          uv run radar anomalies || echo "Anomalies check skipped"
          uv run python scripts/export.py

      - name: Create audit report and branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Bharat Malhotra"
          git config user.email "mr.bharatmalhotra@gmail.com"

          STAMP=$(date -u +%Y-%m-%d-%H)
          DATE_STR=$(date -u +%Y-%m-%d)
          BRANCH_NAME="radar/breakouts-${STAMP}"
          REPORT_DIR="reports/breakouts"
          mkdir -p "$REPORT_DIR"
          REPORT_PATH="${REPORT_DIR}/${STAMP}.md"

          cat << EOF > "$REPORT_PATH"
          # AI Open Source Radar — Breakout & Velocity Audit ($DATE_STR)

          Automated intelligence audit identifying fast-moving open-source AI repositories, star velocity spikes, and anomaly indicators.

          ## Highlights
          - Generated via scheduled intelligence pipeline on $DATE_STR at $(date -u +%H:%M) UTC.
          - Updated datasets: \`data/exports/breakouts.json\`, \`data/exports/anomalies.json\`.
          - Verified against three-axis scoring (Impact, Velocity, Health).
          EOF

          git checkout -b "$BRANCH_NAME"
          git add data/exports/breakouts.json data/exports/anomalies.json "$REPORT_PATH" -f

          if git diff --staged --quiet; then
            echo "::notice::No breakout changes detected to open PR."
            exit 0
          fi

          git commit -m "feat(intelligence): daily AI breakout repos & velocity audit [$DATE_STR]"
          git push origin "$BRANCH_NAME"

          # Open Pull Request using GitHub CLI
          PR_URL=$(gh pr create \
            --title "feat(intelligence): daily AI breakout repos & velocity audit [$DATE_STR]" \
            --body "Automated breakout intelligence report and data snapshot update for $DATE_STR. Generated by AI Radar intelligence pipeline." \
            --base main \
            --head "$BRANCH_NAME" || true)

          # Auto-merge PR (squash)
          gh pr merge "$BRANCH_NAME" --squash --delete-branch || gh pr merge --squash --auto "$BRANCH_NAME" || echo "Auto-merge deferred."
