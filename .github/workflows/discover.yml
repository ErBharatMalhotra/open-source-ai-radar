# Discover new open-source AI repositories every 6 hours
name: Discover Repos

on:
  schedule:
    - cron: "0 2 * * *"  # Daily at 2:00 UTC
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-latest
          restore-keys: radar-db-

      - name: Show smart discovery queries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run radar smart-queries || echo "No smart queries yet"

      - name: Run category discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run radar discover --limit 100 --category ai-agents
          uv run radar discover --limit 100 --category llm-frameworks
          uv run radar discover --limit 100 --category ai-coding
          uv run radar discover --limit 100 --category mcp
          uv run radar discover --limit 100 --category rag
          uv run radar discover --limit 100 --category local-ai

      - name: Import to SQLite
        run: uv run radar import-json

      - name: Classify repos
        run: uv run radar classify

      - name: Incremental pipeline (detect changes, snapshot, score)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run radar process

      - name: Run anomaly detection
        run: uv run radar anomalies || echo "No anomalies detected"

      - name: Analyze why trending
        run: uv run radar why-trending --limit 25 || echo "No trending data yet"

      - name: Detect breakouts
        run: uv run radar breakouts --limit 25 || echo "No breakout data yet"

      - name: Export JSON
        run: uv run python scripts/export.py

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          key: radar-db-latest

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/ -f
          git diff --staged --quiet || git commit -m "chore: update discovery data"
          git push || echo "Push failed (maybe no changes)"
