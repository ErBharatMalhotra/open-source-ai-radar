# Open Source AI Radar — Category Configuration
# Each category defines topics and keywords for GitHub discovery

categories:
  ai-agents:
    name: "AI Agents"
    description: "Autonomous agents, agent frameworks, multi-agent systems"
    topics:
      - "ai-agent"
      - "autonomous-agent"
      - "agent-framework"
      - "multi-agent"
      - "agent"
      - "langchain"
      - "autogpt"
      - "crewai"
    keywords:
      - "AI agent framework"
      - "autonomous agent"
      - "multi-agent system"
      - "agentic AI"
      - "agent orchestration"
    sub_categories:
      - "Coding Agent"
      - "Research Agent"
      - "Task Agent"
      - "Conversational Agent"

