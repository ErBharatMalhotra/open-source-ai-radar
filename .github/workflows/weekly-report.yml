# Generate weekly intelligence report
name: Weekly Report

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 8:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-latest
          restore-keys: radar-db-

      - name: Generate weekly report
        run: uv run radar report

      - name: Generate social drafts
        run: uv run radar social-drafts

      - name: Generate RSS feed
        run: uv run radar feed

      - name: Export data
        run: uv run python scripts/export.py

      - name: Commit report and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/exports/ -f
          git diff --staged --quiet || git commit -m "chore: weekly report $(date +'%Y-W%W') [skip ci]"
          git push || echo "Push failed"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date +'%Y-W%W')
          REPORT_FILE=$(ls reports/week-${WEEK}.md 2>/dev/null || echo "")
          if [ -n "$REPORT_FILE" ]; then
            gh release create "v${WEEK}" "$REPORT_FILE" \
              --title "📊 Weekly Report ${WEEK}" \
              --notes-file "$REPORT_FILE" \
              --latest=false || echo "Release creation failed"
          fi
