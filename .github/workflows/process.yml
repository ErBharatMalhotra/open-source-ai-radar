# Process scheduled repos (snapshot + score + export + deploy)
name: Process Repos

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-repos
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Show scheduler status
        run: uv run radar scheduler-stats || echo "No scheduler yet"

      - name: Mark repos as processing
        run: uv run radar schedule --dry-run

      - name: Process batch (rate-limit-aware)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run radar process --limit 700

      - name: Run anomaly detection
        run: uv run radar anomalies || echo "No anomalies detected"

      - name: Analyze why trending
        run: uv run radar why-trending --limit 25 || echo "No trending data yet"

      - name: Detect breakouts
        run: uv run radar breakouts --limit 25 || echo "No breakout data yet"

      - name: Export JSON
        run: uv run python scripts/export.py

      - name: Retention cleanup (snapshots + scores)
        # Cheap indexed deletes; no-ops until rows age past their keep window.
        run: uv run radar retention-cleanup --execute

      - name: Refresh README live stats
        run: uv run python scripts/update_readme_stats.py

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          # Unique key per run: cache entries are immutable, so a fixed key
          # would silently skip every save after the first one.
          key: radar-db-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/ -f
          git add README.md web/src/layouts/Layout.astro web/src/pages/index.astro
          if git diff --staged --quiet; then
            echo "::notice::No data changes to commit — skipping push"
          else
            git commit -m "chore: process update"
            git pull --rebase origin main
            git push
          fi
