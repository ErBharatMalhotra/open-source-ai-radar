# Build and deploy website to GitHub Pages
name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "data/exports/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Build from committed data/exports (process.yml refreshes them daily).
      # Do NOT regenerate exports here: a stale radar.db cache would overwrite
      # good committed export JSONs (this broke avatars/names before).

      - name: Build website
        working-directory: web
        run: npm run build

      - name: Copy API files to dist
        run: |
          if [ -d data/exports/api ]; then
            cp -r data/exports/api dist/api
            echo "Copied API files to dist/api"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
