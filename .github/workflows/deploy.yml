# Build and deploy website to GitHub Pages
name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "data/exports/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-latest
          restore-keys: radar-db-
          fail-on-cache-miss: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install Python dependencies
        run: uv sync

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Export data (if available)
        run: |
          if [ -f data/radar.db ]; then
            uv run python scripts/export.py
          else
            echo "No database found — using existing committed exports"
            ls -la data/exports/ 2>/dev/null || echo "No exports directory found"
          fi

      - name: Build website
        working-directory: web
        run: npm run build

      - name: Copy API files to dist
        run: |
          if [ -d data/exports/api ]; then
            cp -r data/exports/api dist/api
            echo "Copied API files to dist/api"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
