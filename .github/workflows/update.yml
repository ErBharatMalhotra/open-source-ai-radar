# Daily snapshot + score + export
name: Daily Update

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-latest
          restore-keys: radar-db-

      - name: Incremental pipeline (detect changes, snapshot, score)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run radar process

      - name: Export JSON
        run: uv run python scripts/export.py

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          key: radar-db-latest

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/ -f
          git diff --staged --quiet || git commit -m "chore: daily update [skip ci]"
          git push || echo "Push failed"
