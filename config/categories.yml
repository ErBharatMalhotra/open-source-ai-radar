# Open Source AI Radar — Category Configuration
#
# Order matters: categories are matched specific → generic, and the best
# score wins with first-match tie-breaking. Keep narrow domains (MCP, RAG,
# AI Coding) above broad ones (AI Agents, LLM Frameworks).
#
# Each category defines topics (GitHub topic tags) and keywords (matched as
# word-boundary patterns against description + repo name + topics).

categories:
  mcp:
    name: "MCP"
    description: "Model Context Protocol, MCP servers and tools"
    topics:
      - "mcp"
      - "model-context-protocol"
      - "mcp-server"
      - "mcp-client"
      - "mcp-tools"
      - "mcp-tool"
    keywords:
      - "MCP"
      - "Model Context Protocol"
      - "MCP server"
      - "MCP client"
    sub_categories:
      - "Server"
      - "Client"
      - "Tool"
      - "Integration"

  rag:
