# Build and deploy website to GitHub Pages
name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Export data (if available)
        run: |
          if [ -f data/radar.db ]; then
            uv run python scripts/export.py
          else
            echo "No database found — creating empty exports for static site"
            mkdir -p data/exports
            echo '{"generated_at":"","total":0,"repos":[]}' > data/exports/top.json
            echo '{"generated_at":"","total":0,"repos":[]}' > data/exports/trending.json
            echo '{"generated_at":"","repos":[]}' > data/exports/trends.json
            echo '{"generated_at":"","total_repos":0,"total_stars":0,"top_languages":{}}' > data/exports/stats.json
            echo '{}' > data/exports/categories.json
            echo '{"generated_at":"","total":0,"repos":[]}' > data/exports/repositories.json
          fi

      - name: Build website
        working-directory: web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
