# Discover new repos + sync scheduler (lightweight)
name: Discover Repos

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-repos
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Run category discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run radar discover --limit 50 --category ai-agents
          uv run radar discover --limit 50 --category llm-frameworks
          uv run radar discover --limit 50 --category ai-coding
          uv run radar discover --limit 50 --category mcp
          uv run radar discover --limit 50 --category rag
          uv run radar discover --limit 50 --category local-ai

      - name: Import to SQLite
        run: uv run radar import-json

      - name: Classify repos
        run: uv run radar classify

      - name: Sync processing scheduler
        run: uv run radar sync-cursor

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          # Unique key per run — cache entries are immutable, a fixed key
          # would silently skip every save after the first one.
          key: radar-db-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/ -f
          if git diff --staged --quiet; then
            echo "::notice::No data changes to commit — skipping push"
          else
            git commit -m "chore: discovery + scheduler sync"
            git pull --rebase origin main
            git push
          fi
